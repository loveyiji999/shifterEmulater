<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><title>SHIFT LAB 車輛接地診斷</title>
<style>body{margin:0;background:#14202a;color:#e5eeee;font:15px system-ui}header{padding:12px}button,select{font:inherit;margin:4px}canvas{width:100%;height:65vh;display:block}pre{padding:12px;white-space:pre-wrap}iframe{display:none}</style>
<header>外部開發工具：實際 Rapier 車身、輪心與懸吊射線
<select id="preset"><option>standard</option><option>city</option><option>turbo</option><option>diesel</option></select>

<button id="reset">重建工況</button><button id="step">前進 120 步</button><button id="export">匯出實際讀值</button>
