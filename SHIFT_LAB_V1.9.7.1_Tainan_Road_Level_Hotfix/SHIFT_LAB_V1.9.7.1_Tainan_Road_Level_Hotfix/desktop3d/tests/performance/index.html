<h1>記錄實際遊戲的卡頓</h1>
<p>請在原本遊戲的同一個分頁開啟本頁，避免同時執行兩份遊戲。</p>
<p>開始後會回到遊戲，沿用已保存的地圖與車輛設定。請照常行駛，重現地形載入或碰撞時的卡頓。60 秒後會下載一份 JSON；也可以按 Esc 提早結束記錄。</p>
<a href="../../?capture-performance=60">載入遊戲並開始記錄</a>
<small>僅供開發版本機排查。記錄包含瀏覽器、畫面尺寸、地圖設定、幀時間與碰撞／載入耗時，不會上傳資料，也不會更改畫質或物理參數。這是帶有量測開銷的診斷，不是效能驗收。</small>
